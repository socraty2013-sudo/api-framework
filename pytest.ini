[pytest]
testpaths = ./tests

# -v:verbose，详细输出，打印每个用例名称、结果
# -s:关闭标准输出捕获，print / 日志直接打印到控制台
# 全局重试：-rerun 2:任何用例失败，最多重试 2 次。 --rerun-delay 1每次间隔 1 秒(非内置功能，需安装 pytest-rerunfailures)
addopts = -v  --reruns 2 --reruns-delay 1

# 实时把日志打到终端
log_cli = true

# 注册 mark 标记标签，冒号后面是描述
markers=
    smoke: 冒烟用例，每次提交必跑
    regression: 回归用例，发版前跑



